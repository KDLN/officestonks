# Railway configuration for IPv4 settings
[build]
builder = "DOCKERFILE"
dockerfile = "Dockerfile"

[deploy]
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
startCommand = "/app/server"

[deploy.env]
# Force IPv4 for all connections
PORT = "8080"
GODEBUG = "netdns=go" # Use Go's DNS resolver instead of the system one
# Disable IPv6 for database connections
MYSQL_TCP_PROTOCOL = "4"

[deploy.envs] 
IP_VERSION = "4"
IPV6_DISABLED = "true"